  <!-- Siete zonas temáticas canónicas, tratadas como regiones del planeta, no como niveles nuevos. -->
  <g opacity=".58">
    <path d="M60 135q54-45 110-8t29 102q-39 34-93 10t-46-104Z" fill="#687c52"/><use href="#landmark" transform="translate(120 160)"/>
    <path d="M230 102q55-37 111-2t27 99q-40 33-95 9t-43-106Z" fill="#536b4f"/><g fill="#54785e"><circle cx="280" cy="145" r="12"/><circle cx="310" cy="169" r="17"/><circle cx="340" cy="132" r="14"/></g>
    <path d="M405 94q58-45 112-1t27 101q-41 31-96 8t-43-108Z" fill="#777459"/><use href="#landmark" transform="translate(445 117) scale(.8)"/>
    <path d="M575 91q54-39 107 2t24 97q-39 32-94 10t-37-109Z" fill="#617b70"/><path d="M600 145q35-30 70 3t-8 43q-39 5-62-18Z" fill="#88a6a2" opacity=".7"/>
    <path d="M745 91q55-40 108 1t25 98q-39 32-94 10t-39-109Z" fill="#7d6e53"/><path d="m789 135 15-27 14 27m-3 26 21-42 20 42" fill="#c3b28b"/>
    <path d="M915 117q56-39 110 1t25 98q-39 32-94 10t-41-109Z" fill="#4d6661"/><path d="M938 172q32-24 56 7t47-5" fill="none" stroke="#9bafa3" stroke-width="8"/>
    <path d="M1080 156q55-38 108 2t23 96q-39 32-94 10t-37-108Z" fill="#735d4f"/><path d="m1106 225 18-45 15 45m8-1 18-57 19 57" fill="#aa7059"/>
  </g>
  <!-- Velo gris orgánico para las tierras aún no conquistadas; no representa límites jugables. -->
  <path d="M250 77 C292 108 271 134 304 169 C335 199 297 222 337 250 C367 281 317 300 350 337 C380 370 345 397 381 430 L1330 450 L1330 50 Z" fill="#b2b7b2" opacity=".22" clip-path="url(#land-clip)"/>
  <!-- Travesía de oeste a este en serrucho. Puntos y regiones son una propuesta de coordenadas. -->
  <path d="M112 266Q158 223 194 254T276 296 358 235 440 278 522 310 604 246 686 286 768 314 850 250 932 291 1014 318 1096 245 1178 283 1260 308" fill="none" stroke="#e5c77d" stroke-opacity=".9" stroke-width="4" stroke-dasharray="5 9" stroke-linecap="round"/>
  <g transform="translate(20 270)"><circle r="29" fill="#1a2427" stroke="#e2b95e" stroke-width="3"/><use href="#lander" transform="scale(.72)"/><text y="49" fill="#f1d99b" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="700">ATERRIZAJE</text></g>
  <g font-family="sans-serif" font-weight="700" text-anchor="middle">
    <!-- Los estados son un ejemplo de lectura, no un guardado ni una regla nueva. -->
    <g transform="translate(112 266)"><circle r="29" fill="url(#player)" stroke="#f5e3ad" stroke-width="3"/><text y="8" font-size="22" fill="#25241f">1</text><use href="#flag" transform="translate(20 -20) scale(.56)"/><g fill="#ffe7a0"><use href="#star" transform="translate(-12 -39) scale(.52)"/><use href="#star" transform="translate(0 -44) scale(.58)"/><use href="#star" transform="translate(12 -39) scale(.52)"/></g></g>
    <g transform="translate(194 254)"><circle r="29" fill="url(#rebel)" stroke="#f0b785" stroke-width="3"/><path d="M0-27a27 27 0 0 1 0 54Z" fill="url(#player)"/><circle r="29" fill="none" stroke="#f2dec0" stroke-width="2"/><text y="8" font-size="22" fill="#282522">2</text><use href="#rebel-flag" transform="translate(20 -20) scale(.56)"/><g fill="#f4c58c"><use href="#star" transform="translate(-8 -39) scale(.52)"/><use href="#star" transform="translate(8 -39) scale(.52)"/></g></g>
    <g transform="translate(276 296)"><circle r="29" fill="url(#rebel)" stroke="#f0cb70" stroke-width="3"/><text y="8" font-size="22" fill="#fff0c7">3</text><circle cy="37" r="3" fill="#f0cb70"/></g>
    <g transform="translate(358 235)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">4</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(440 278)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">5</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(522 310)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">6</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(604 246)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">7</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(686 286)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">8</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(768 314)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">9</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(850 250)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">10</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(932 291)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">11</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1014 318)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">12</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1096 245)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">13</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1178 283)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">14</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1260 308)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">15</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
  </g>
</svg>
