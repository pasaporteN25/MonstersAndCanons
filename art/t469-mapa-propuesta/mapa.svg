<!-- Maqueta editable de geografía e insignias; mapa conceptual de campaña, no terreno jugable. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="450" viewBox="0 0 1320 450" role="img" aria-labelledby="title desc">
  <title id="title">Propuesta de atlas planetario con insignias de conquista</title>
  <desc id="desc">Quince regiones orgánicas avanzan de oeste a este por una costa en zigzag. Los círculos muestran estados de conquista ilustrativos.</desc>
  <defs>
    <linearGradient id="sea" x2="0.8" y2="1"><stop stop-color="#233c47"/><stop offset=".55" stop-color="#1b3039"/><stop offset="1" stop-color="#14242c"/></linearGradient>
    <linearGradient id="land" x2=".15" y2="1"><stop stop-color="#64704b"/><stop offset=".5" stop-color="#465540"/><stop offset="1" stop-color="#303d35"/></linearGradient>
    <linearGradient id="player" x2="0" y2="1"><stop stop-color="#ffe39a"/><stop offset="1" stop-color="#bd8240"/></linearGradient>
    <linearGradient id="rebel" x2="0" y2="1"><stop stop-color="#e78b67"/><stop offset="1" stop-color="#98463b"/></linearGradient>
    <clipPath id="land-clip"><use href="#land-shape"/></clipPath>
    <pattern id="contour" width="112" height="70" patternUnits="userSpaceOnUse"><path d="M-20 42Q12 4 48 29T116 25M-10 57Q27 26 59 48t68-1" fill="none" stroke="#e0d0a0" stroke-opacity=".15" stroke-width="1.3"/></pattern>
    <g id="star"><path d="m0-9 2.6 5.8 6.3.7-4.7 4.2 1.3 6.2L0 13-5.5 9l1.3-6.2L-9-3.5l6.3-.7Z"/></g>
    <g id="flag" stroke="#25272a" stroke-width="2" stroke-linejoin="round"><path d="M0 2v-23" fill="none"/><path d="M1-21 19-16 6-7 1-9Z" fill="url(#player)"/></g>
    <g id="rebel-flag" stroke="#25272a" stroke-width="2" stroke-linejoin="round"><path d="M0 2v-23" fill="none"/><path d="M1-21 19-16 6-7 1-9Z" fill="url(#rebel)"/></g>
    <g id="lock" fill="none" stroke="#d1d3cc" stroke-width="2"><rect x="-7" y="-1" width="14" height="11" rx="2" fill="#50585a"/><path d="M-4-1v-4a4 4 0 0 1 8 0v4"/></g>
    <g id="lander" stroke="#302a26" stroke-width="2" stroke-linejoin="round"><path d="m-13 7 4-18 9-8 9 8 4 18-7 6h-12Z" fill="#c59e61"/><path d="m-6-4 6-6 6 6-2 8h-8Z" fill="#efdbac"/><path d="m-8 11-7 12m23-12 7 12M-18 23h36" fill="none" stroke="#e0b965" stroke-width="3"/><circle cy="-1" r="2" fill="#fff0a8" stroke="none"/></g>
    <g id="landmark" fill="#d0c79e" opacity=".7"><path d="m0 24 16-31 15 31Z"/><path d="m25 24 20-45 22 45Z"/><path d="m62 24 13-27 14 27Z"/></g>
  </defs>
  <rect width="1320" height="450" rx="18" fill="url(#sea)"/>
  <g fill="none" stroke="#9fc2b6" stroke-opacity=".23" stroke-width="2"><path d="M-20 92q95 33 166-3t150 8 181-8 166 15 156-5 170 2 152-13 190 16"/><path d="M-30 350q92-25 170 13t160-9 180 7 162-20 163 7 164-5 190 13 160-10"/></g>
  <!-- Costa orgánica abierta: la ruta no vuelve al oeste ni forma un anillo. -->
  <path id="land-shape" d="M0 230 C28 215 34 185 56 173 C76 161 72 139 99 130 C125 120 137 99 166 93 C190 87 208 106 229 107 C253 108 263 83 284 74 C307 64 323 79 334 99 C343 116 359 110 368 94 C380 73 397 59 418 62 C440 65 448 91 465 96 C486 102 499 77 512 66 C532 48 552 54 564 76 C577 98 593 101 606 80 C619 58 638 48 657 59 C677 70 681 99 700 103 C720 107 733 78 750 67 C769 54 790 64 800 84 C811 105 826 113 842 96 C859 78 877 74 894 86 C910 97 912 122 932 129 C954 136 970 108 991 111 C1012 114 1018 139 1038 146 C1060 153 1078 131 1099 139 C1122 147 1127 172 1150 178 C1172 184 1190 162 1210 173 C1230 184 1230 207 1254 212 C1277 217 1292 220 1320 235 L1320 314 C1299 324 1281 310 1264 328 C1247 347 1230 363 1206 353 C1181 343 1167 373 1143 378 C1119 383 1108 365 1087 374 C1066 383 1058 410 1037 415 C1016 420 1006 400 984 405 C962 410 953 435 931 434 C909 433 899 411 878 416 C856 421 846 442 824 439 C802 436 797 413 775 416 C753 419 743 439 722 434 C701 429 694 406 672 408 C650 410 640 432 619 426 C598 420 595 396 574 397 C552 398 541 419 519 412 C498 405 497 382 475 380 C453 378 442 400 420 393 C398 386 397 362 375 359 C353 356 339 378 317 368 C295 358 297 334 275 332 C253 330 239 354 217 345 C195 336 199 310 177 305 C155 300 138 323 117 312 C96 301 100 277 79 270 C58 263 41 285 24 274 C9 264 11 245 0 250 Z" fill="url(#land)" stroke="#2b2233" stroke-width="3" stroke-linejoin="round"/>
