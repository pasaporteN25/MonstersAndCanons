    <g transform="translate(522 310)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="22" fill="#c7cbc2">6</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
