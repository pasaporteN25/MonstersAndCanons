    <path d="M1080 156q55-38 108 2t23 96q-39 32-94 10t-37-108Z" fill="#735d4f"/><path d="m1106 225 18-45 15 45m8-1 18-57 19 57" fill="#aa7059"/>
  </g>
  <!-- Velo gris orgánico para las tierras aún no conquistadas; no representa límites jugables. -->
