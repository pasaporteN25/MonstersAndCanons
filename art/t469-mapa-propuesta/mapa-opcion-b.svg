    <g transform="translate(112 266)"><circle r="29" fill="url(#player)" stroke="#f5e3ad" stroke-width="3"/><text y="8" font-size="22" fill="#25241f">1</text><use href="#flag" transform="translate(20 -20) scale(.56)"/><g fill="#ffe7a0"><use href="#star" transform="translate(-12 -39) scale(.52)"/><use href="#star" transform="translate(0 -44) scale(.58)"/><use href="#star" transform="translate(12 -39) scale(.52)"/></g></g>
    <g transform="translate(194 254)"><circle r="29" fill="url(#rebel)" stroke="#f0b785" stroke-width="3"/><path d="M0-27a27 27 0 0 1 0 54Z" fill="url(#player)"/><circle r="29" fill="none" stroke="#f2dec0" stroke-width="2"/><text y="8" font-size="22" fill="#282522">2</text><use href="#rebel-flag" transform="translate(20 -20) scale(.56)"/><g fill="#f4c58c"><use href="#star" transform="translate(-8 -39) scale(.52)"/><use href="#star" transform="translate(8 -39) scale(.52)"/></g></g>
