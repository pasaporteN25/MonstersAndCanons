  <g transform="translate(20 270)"><circle r="29" fill="#1a2427" stroke="#e2b95e" stroke-width="3"/><use href="#lander" transform="scale(.72)"/><text y="49" fill="#f1d99b" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="700">ATERRIZAJE</text></g>
  <g font-family="sans-serif" font-weight="700" text-anchor="middle">
