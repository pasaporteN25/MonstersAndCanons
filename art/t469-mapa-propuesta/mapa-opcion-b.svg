    <g transform="translate(850 250)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">10</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(932 291)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">11</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1014 318)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">12</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1096 245)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">13</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1178 283)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">14</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
    <g transform="translate(1260 308)"><circle r="29" fill="#824b40" stroke="#aa7969" stroke-width="2.5"/><text y="8" font-size="20" fill="#c7cbc2">15</text><use href="#lock" transform="translate(19 -21) scale(.65)"/></g>
