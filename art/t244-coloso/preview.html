<!doctype html><html lang="es"><meta charset="utf-8"><title>T244 · Coloso provisional</title><style>body{background:#1b2027;color:#eee;font:18px sans-serif;margin:30px}section{display:inline-block;background:#8baf60;padding:20px;margin:15px}canvas{width:256px;height:256px}label{display:block}a{color:#dfba78}</style><h1>T244 · PROVISIONAL</h1><p>Sin aprobación artística de Lucas. Vista de exposición: en partida los pasos siguen la distancia recorrida.</p><label>Dirección <select id="direction"><option value="0">Derecha</option><option value="1">Abajo</option><option value="2">Izquierda</option><option value="3">Arriba</option></select></label><section><h2>Coloso</h2><canvas id="colossus" width="256" height="256"></canvas></section><section><h2>Pedazo</h2><canvas id="colossus_shard" width="256" height="256"></canvas></section><p><a href="captures/game_step_1.png">Muestra en escena real</a> · <a href="captures/contact_34.png">Lectura a 34 px</a> · <a href="captures/contact_112.png">Wiki a 112 px</a> · <a href="captures/contact_220.png">Detalle</a></p><script>const row=document.querySelector('#direction');for(const id of ['colossus','colossus_shard']){const img=new Image();img.src='../../assets/sprites/enemies/rendered/'+id+'_walk.png';const ctx=document.getElementById(id).getContext('2d');function draw(t){ctx.clearRect(0,0,256,256);if(img.complete)ctx.drawImage(img,Math.floor(t/(id==='colossus'?550:138))%4*256,Number(row.value)*256,256,256,0,0,256,256);requestAnimationFrame(draw)}requestAnimationFrame(draw)}</script></html>
