<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mortero: un tubo corto y ancho sobre una placa redonda. Apunta a la derecha; gira sobre el centro (32, 32).
       Se dibuja sobre una torre de 2×2 casillas, así que ocupa todo el cuadrado. -->
  <circle cx="32" cy="32" r="21" fill="#4a4037" stroke="#2b2233" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="17" fill="#5c5044"/>
  <g fill="#9a8a72" stroke="#2b2233" stroke-width="1">
    <circle cx="32" cy="14.5" r="1.8"/><circle cx="32" cy="49.5" r="1.8"/>
    <circle cx="14.5" cy="32" r="1.8"/><circle cx="49.5" cy="32" r="1.8"/>
  </g>
  <g stroke="#2b2233" stroke-linejoin="round" stroke-width="2.4">
    <rect x="20" y="20" width="31" height="24" rx="5" fill="#7a5a36"/>
    <rect x="47" y="16.5" width="11" height="31" rx="4" fill="#9a7446"/>
  </g>
  <rect x="34" y="20" width="3.2" height="24" fill="#5d4327"/>
  <ellipse cx="58" cy="32" rx="2.6" ry="8.5" fill="#1d1a20"/>
  <ellipse cx="57.4" cy="32" rx="1.3" ry="5.5" fill="#3a3340"/>
  <ellipse cx="30" cy="25" rx="8" ry="2.8" fill="#ffffff" opacity="0.28"/>
  <circle cx="32" cy="32" r="5.5" fill="#6d6152" stroke="#2b2233" stroke-width="1.5"/>
</svg>
