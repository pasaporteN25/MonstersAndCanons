  <rect x="28" y="40" width="8" height="15" rx="2" fill="#7a4f2a" stroke="#2b2233" stroke-width="2.4"/>
  <g fill="#2b2233">
    <circle cx="22" cy="31" r="15"/>
    <circle cx="42" cy="30" r="15.5"/>
    <circle cx="32" cy="18" r="15"/>
  </g>
  <g fill="#3f8a3a">
    <circle cx="22" cy="31" r="12.6"/>
    <circle cx="42" cy="30" r="13.1"/>
    <circle cx="32" cy="18" r="12.6"/>
  </g>
  <g fill="#2f6e2c">
    <circle cx="26" cy="38" r="7"/>
    <circle cx="44" cy="37" r="7"/>
  </g>
  <g fill="#5fae4c">
    <circle cx="27" cy="13" r="5"/>
    <circle cx="16" cy="27" r="3.5"/>
    <circle cx="39" cy="24" r="4"/>
